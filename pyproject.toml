[project]
name = "cede"
version = "0.2.0"
description = "CEDE -- Containerized Embedded Development Environment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.0",
    "pyyaml>=6.0",
]

[project.scripts]
cede = "cede.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pillow>=10,<12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cede"]
